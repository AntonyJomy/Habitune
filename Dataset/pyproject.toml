[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitune-map-data"
version = "0.1.0"
description = "Reproducible data preparation for Habitune Map Interaction 1 - View 1"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
habitune-data = "habitune_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
